<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Codex Session Hub workflow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="36" fill="url(#bg)"/>
  <text x="600" y="76" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="40" fill="#f8fafc" font-weight="700">Codex Session Hub</text>
  <text x="600" y="114" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#cbd5e1">Keep task context alive across Codex chats without storing full transcripts</text>
  <g filter="url(#shadow)">
    <rect x="70" y="185" width="210" height="150" rx="22" fill="url(#card)"/>
    <rect x="350" y="185" width="210" height="150" rx="22" fill="url(#card)"/>
    <rect x="630" y="185" width="210" height="150" rx="22" fill="url(#card)"/>
    <rect x="910" y="185" width="210" height="150" rx="22" fill="url(#card)"/>
  </g>
  <text x="175" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Codex Chat</text>
  <text x="175" y="262" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">messy task context</text>
  <text x="175" y="288" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">decisions, files, TODOs</text>
  <text x="455" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Sync</text>
  <text x="455" y="262" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">save compact Markdown</text>
  <text x="455" y="288" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">not full transcripts</text>
  <text x="735" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Session Hub</text>
  <text x="735" y="262" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">sessions · handoffs</text>
  <text x="735" y="288" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">decisions · questions</text>
  <text x="1015" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Continue Later</text>
  <text x="1015" y="262" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">search history</text>
  <text x="1015" y="288" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">recover next action</text>
  <path d="M290 260 H335" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <path d="M570 260 H615" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <path d="M850 260 H895" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <path d="M330 250 L345 260 L330 270" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M610 250 L625 260 L610 270" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M890 250 L905 260 L890 270" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="270" y="392" width="660" height="54" rx="14" fill="#0ea5e9" opacity="0.18" stroke="#38bdf8"/>
  <text x="600" y="426" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#e0f2fe">Local-first · Markdown files · Obsidian-ready knowledge cards</text>
</svg>
